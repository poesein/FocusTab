name: FocusTab

on:
  push:
    paths: ['focus-tab/**', '.github/workflows/focus-tab.yml']
  pull_request:
    paths: ['focus-tab/**', '.github/workflows/focus-tab.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: focus-tab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: focus-tab/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: FocusTab-extension
          path: focus-tab/dist/
          if-no-files-found: error
          retention-days: 14
